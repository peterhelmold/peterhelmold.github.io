# Coursework 一栏：硕士和本科两组。学年和课程的顺序随便写，网页上自动按学年从新到旧、学年里按课程名排。
# id 和 columns（课程较多时在宽屏上分两栏）是排版用的，一般不用改。
#
# 一门课可以写这些项目，用不到的删掉：
#   title  课程名        url   课程页面链接，没有就只显示名字
#   code   课程代码      term  学期，如 Fall 2025
#   files  课程资料 PDF，名称可用 Essay、Report、Presentation、Notes，网页上按这个顺序显示
# 两门连着上的课（如 Analysis I / II）写成 parts，下面各列一门。
# 加新资料时先把 PDF 放进 files/Graduate/，再在这里写上路径；课程数目由脚本自动统计。
